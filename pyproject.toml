[project]
name = "resumeiq-system"
version = "1.0.0"
description = "ResumeIQ - AI Powered Resume Intelligence, Job Matching and Skill Development System"

requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "pymongo>=4.18.0",
    "PyJWT>=2.13.0",
    "bcrypt>=5.0.0",
    "python-multipart",
    "email-validator",
    "python-dotenv",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "joblib",
    "scikit-learn",
    "numpy"
]

[tool.vercel]
entrypoint = "backend.main:app"
